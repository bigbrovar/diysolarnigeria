# DIY Solar Calculator: everything the page shows or calculates with.
# Edit this file, then run `python3 build.py`. The page is rebuilt in dist/.

title: DIY Solar Calculator
tagline: Tick what you run. See what it uses, what it costs on the grid, and what size of solar covers it.
source_url: https://github.com/bigbrovar/diysolarnigeria

# The public address of the site, like https://solar.example.ng (no slash at
# the end). Leave it empty until the site has one. When it is set, links shared
# on WhatsApp, X and others show a preview card using og.png.
site_url: ""

# What the page starts with.
defaults:
  state: FCT, Abuja
  price: 209.5        # naira per kWh
  when: even          # one of the ids under `when` below

# The sizing rules. Each one is shown to the reader under "See how it is worked out".
rules:
  inverter_load: 0.8    # run the inverter at 80% of its rating or less
  battery_use: 0.8      # a lithium battery goes down to 20% and no lower
  battery_loss: 0.03    # share lost putting energy into the battery and taking it out
  panel_losses: 0.75    # what is left after heat, dust, cable and inverter losses
  panel_watts: 550      # the panel size used to count panels
  days_in_month: 30

# Quick-pick prices, in naira per kWh.
# Home (non-MD) rates for Abuja Electric, from NERC order ORDER/NERC/2025/059,
# effective 1 July 2025: https://nerc.gov.ng/wp-content/uploads/2025/08/AEDC_July_2025_059.pdf
bands:
  - {name: Band A, price: 209.5}
  - {name: Band B, price: 63.35}
  - {name: Band C, price: 51.79}
  - {name: Band D, price: 33.95}
band_note: Band prices are Abuja Electric home rates from NERC's July 2025 tariff order. Other DisCos differ a little, so check your bill for your own rate.

# "When do you use most of your power?" `night` is the share of a day's energy
# used after sunset.
when:
  - {id: day, label: Mostly daytime, night: 0.3}
  - {id: even, label: "About even, day and night", night: 0.5}
  - {id: night, label: Mostly at night, night: 0.7}

# Good sun hours a day for each state (yearly average, kWh per square metre a day).
# From NASA POWER (https://power.larc.nasa.gov): the long-term average of sunlight on a
# flat surface (ALLSKY_SFC_SW_DWN) at each state capital, rounded to one decimal.
sun_note: "Yearly average at the capital of {state}, from NASA. The rainy season is lower. Change it if you know yours."
states:
  Abia: 4.5
  Adamawa: 5.7
  Akwa Ibom: 4.5
  Anambra: 4.7
  Bauchi: 5.8
  Bayelsa: 4.2
  Benue: 5.0
  Borno: 6.0
  Cross River: 4.2
  Delta: 4.6
  Ebonyi: 4.9
  Edo: 4.5
  Ekiti: 4.7
  Enugu: 4.7
  "FCT, Abuja": 5.3
  Gombe: 5.8
  Imo: 4.5
  Jigawa: 5.9
  Kaduna: 5.6
  Kano: 6.0
  Katsina: 5.9
  Kebbi: 5.8
  Kogi: 4.9
  Kwara: 5.0
  Lagos: 4.6
  Nasarawa: 5.2
  Niger: 5.2
  Ogun: 4.6
  Ondo: 4.7
  Osun: 4.6
  Oyo: 4.6
  Plateau: 5.3
  Rivers: 4.1
  Sokoto: 6.0
  Taraba: 5.4
  Yobe: 6.0
  Zamfara: 5.8
# The appliance picker. For each appliance:
#   id        a short name with no spaces, used in share links. Never change one
#             after launch, or old share links stop ticking that appliance.
#   name      what the reader sees
#   watts     running watts for one
#   qty       how many it starts with when ticked
#   hours     hours a day it starts with (steps of 0.5)
#   selected  true if it is ticked when the page opens
groups:
  - title: Everyday
    note: Lights, fans and screens
    appliances:
      - {id: bulb, name: LED bulbs, watts: 10, qty: 8, hours: 6, selected: true}
      - {id: fan, name: Ceiling fan, watts: 75, qty: 3, hours: 10, selected: true}
      - {id: tv, name: "TV, 43 inch", watts: 80, qty: 1, hours: 6, selected: true}
      - {id: router, name: Decoder and router, watts: 30, qty: 1, hours: 12, selected: true}
      - {id: laptop, name: Laptop, watts: 65, qty: 1, hours: 8}
      - {id: phone, name: Phone charging, watts: 10, qty: 2, hours: 3, selected: true}
  - title: Kitchen
    note: A fridge or freezer counts as about 8 hours of running
    appliances:
      - {id: fridge, name: Fridge, watts: 150, qty: 1, hours: 8, selected: true}
      - {id: freezer, name: Chest freezer, watts: 120, qty: 1, hours: 8}
      - {id: micro, name: Microwave, watts: 1200, qty: 1, hours: 0.5}
      - {id: blender, name: Blender, watts: 400, qty: 1, hours: 0.5}
      - {id: induction, name: Induction cooker, watts: 2000, qty: 1, hours: 1}
      - {id: oven, name: Electric oven, watts: 2500, qty: 1, hours: 0.5}
  - title: Heavy loads
    note: These decide your inverter size
    appliances:
      - {id: iron, name: Pressing iron, watts: 1000, qty: 1, hours: 0.5}
      - {id: washer, name: Washing machine, watts: 500, qty: 1, hours: 1}
      - {id: pump, name: "Pumping machine, 1 HP", watts: 750, qty: 1, hours: 1}
      - {id: ac1, name: "AC, 1 HP inverter", watts: 900, qty: 1, hours: 6}
      - {id: ac15, name: "AC, 1.5 HP inverter", watts: 1100, qty: 1, hours: 6}
      - {id: ac2, name: "AC, 2 HP inverter", watts: 1500, qty: 1, hours: 6}
      - {id: heater, name: Water heater, watts: 2000, qty: 1, hours: 1.5}
